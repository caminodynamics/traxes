# Test policy for numeric_lte operator
apiVersion: Traxes.dev/v1
kind: ExecutionPolicy
metadata:
  name: cost-limit-test
  environment: test
target:
  tool: aws_ec2_provision
rules:
  - name: deny_expensive_instances
    operator: numeric_lte
    condition_value: "2.00"
    field: instance_cost_per_hour
    action: DENY
    reason: "Instance cost exceeds limit"
