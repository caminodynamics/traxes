[package]
name = "traxes-demo"
version = "0.3.2"
edition = "2021"
description = "Reference implementation: deterministic pre-execution validation layer for autonomous actions."
default-run = "traxes-demo"
[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
colored = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
serde_yaml = "0.9"

dhat = { version = "0.3", optional = true }
clap = { version = "4.6.1", features = ["derive"] }

[features]
default = []
instrumentation = ["dhat"]
metrics = []

[lib]
name = "traxes_demo"
path = "src/lib.rs"

[[bin]]
name = "traxes-demo"
path = "src/main.rs"

[[bin]]
name = "traxes-bench"
path = "src/runner.rs"
